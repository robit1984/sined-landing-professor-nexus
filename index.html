*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:400 16px/1.6 var(--body);min-height:100vh;

.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 24px}
a{color:inherit}

.logo{font:500 17px var(--head);letter-spacing:.04em;text-decoration:none;margin-right:auto}
nav{display:flex;gap:4px}
nav a{padding:6px 14px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
nav a:hover{color:var(--text)}

main{padding:56px 0 96px}

.row{display:flex;gap:12px;flex-wrap:wrap}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.bench{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:20px 22px;font:400 13.5px/1.75 var(--mono);color:var(--muted);overflow-x:auto;white-space:pre}

section{margin-top:84px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);background:var(--panel)}
.steps div{padding:18px;border-right:1px solid var(--line)}.steps div:last-child{border:0}
.steps small{color:var(--accent);font:500 12px var(--mono)}
.steps p{margin-top:4px;font-weight:500}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.muted{color:var(--muted)}.mono{font-family:var(--mono)}
.drop{border:1.5px dashed var(--line);border-radius:4px;padding:44px 24px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--accent);background:rgba(127,166,255,.06)}

label.f{display:block;margin:16px 0 6px;color:var(--muted);font-size:14px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:10px 12px;font:inherit;border-radius:3px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 14px;font:500 14px var(--body);cursor:pointer;border-radius:3px}
.seg button.on{border-color:var(--accent);color:var(--text);background:rgba(127,166,255,.1)}
pre.tree{font:400 13px/1.7 var(--mono);color:var(--muted);overflow:auto;max-height:340px;white-space:pre}

.stage{display:flex;gap:6px;margin:18px 0 6px}
.stage span{flex:1;height:4px;background:var(--line);transition:background .3s}

.log{font:400 13px/1.7 var(--mono);color:var(--muted);margin-top:10px;word-break:break-all}
.log i{color:var(--ok);font-style:normal}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 14px;font:500 14px var(--body);cursor:pointer;border-radius:20px}
.chip.on{color:var(--text);border-color:var(--accent)}
.th{display:grid;grid-template-columns:1fr auto;gap:16px;padding:18px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.th:hover h3{color:var(--accent)}
.th h3{margin-bottom:4px}
.meta{color:var(--muted);font-size:14px}
.tag{display:inline-block;border:1px solid var(--line);padding:0 8px;margin-right:8px;font-size:13px;border-radius:3px}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.cnt{text-align:right;font:500 20px var(--head);color:var(--muted)}.cnt small{display:block;font:400 12px var(--body)}
.reply{padding:16px 0 16px 18px;border-left:2px solid var(--line);margin-top:16px}
.reply.best{border-color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:28px 0}
.stats div{background:var(--panel);padding:18px}
.stats b{display:block;font:300 1.9rem var(--head)}.stats span{color:var(--muted);font-size:14px}
.badge{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.badge.off{opacity:.4}
.empty{padding:36px 0;color:var(--muted)}
.lang{background:transparent;border:1px solid var(--line);color:var(--text);padding:4px 12px;font:500 13px var(--mono);cursor:pointer;border-radius:3px}.lang:hover{border-color:var(--accent)}
.hbr{display:grid;grid-template-columns:110px 1fr 80px;gap:12px;align-items:center;margin:9px 0;font-size:14px}
.hbr div{height:10px;background:var(--line)}.hbr i{display:block;height:100%;background:var(--accent)}.hbr b{font:500 13px var(--mono);text-align:right;color:var(--muted)}
.cols{display:flex;align-items:flex-end;gap:6px;height:130px;border-bottom:1px solid var(--line)}
.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.cols i{display:block;background:var(--accent)}.cols i.p{background:var(--warn)}
.axis{display:flex;justify-content:space-between;color:var(--muted);font:400 12px var(--mono);margin-top:6px}
.leg{display:flex;gap:16px;color:var(--muted);font-size:13px;margin-top:10px}.leg i{display:inline-block;width:10px;height:10px;margin-right:6px;background:var(--accent)}.leg i.p{background:var(--warn)}
.donut{display:flex;gap:20px;align-items:center}.donut svg{width:110px;height:110px;transform:rotate(-90deg)}
.cap{color:var(--muted);font-size:14px;margin-bottom:6px}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:14px;position:relative;z-index:1}
@media(max-width:820px){.hero,.grid2{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.steps div{border-bottom:1px solid var(--line)}.stats{grid-template-columns:1fr 1fr}h1{max-width:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bench span{opacity:1}}
</style>
</head>

<div class="bench" aria-label="Пример сборки"><span style="animation-delay:.2s"><u>$</u> sined build <b>my-mod</b></span><span style="animation-delay:.7s">${x('анализ        ','analysis      ')}<i>${x('12 файлов, 48.2 МБ','12 files, 48.2 MB')}</i></span><span style="animation-delay:1.2s">${x('структура     ','structure     ')}bin/ assets/ docs/ data/</span><span style="animation-delay:1.7s">${x('сжатие        ','compression   ')}<b>${x('deflate, уровень 9','deflate, level 9')}</b></span><span style="animation-delay:2.2s">${x('размер        ','size          ')}<b>${x('31.4 МБ','31.4 MB')}</b> ${x('(минус 35%)','(35% smaller)')}</span><span style="animation-delay:2.9s">sha-256       <i>9f2c41e8a07b…d3e15c</i></span><span style="animation-delay:3.4s"><i>${x('готово','done')}</i></span></div></div>
<section><h2>Как это работает</h2><div class="steps">
<div><small>1</small><p>Загрузка</p><span class="muted">Файлы или ZIP</span></div><div><small>2</small><p>Анализ</p><span class="muted">Типы и размеры</span></div><div><small>3</small><p>Сборка</p><span class="muted">Папки и сжатие</span></div><div><small>4</small><p>Проверка</p><span class="muted">SHA-256 каждого файла</span></div><div><small>5</small><p>Готово</p><span class="muted">Скачайте ZIP</span></div></div></section>
<section><h2>Форум в цифрах</h2><div class="grid2"><div class="panel"><p class="cap">Темы по разделам</p>${hbar(byCat)}</div><div class="panel"><p class="cap">Состояние тем</p><div class="donut">${donut(sol,threads.length-sol)}<div class="leg" style="flex-direction:column;margin:0"><span><i style="background:var(--ok)"></i>${x('Решено','Solved')}: ${sol}</span><span><i style="background:var(--line)"></i>${x('Открыто','Open')}: ${threads.length-sol}</span></div></div></div></div></section>
<section><h2>Свежее на форуме</h2>${t.map(th).join('')}</section>`},

workshop(){
return `<h2>Мастерская</h2><div class="grid2"><div>
<div class="drop" id="drop" tabindex="0" role="button" aria-label="Выбрать файлы">${ic('up')}<p><b>Перетащите файлы сюда</b></p><p class="muted">или нажмите, чтобы выбрать. ZIP раскрывается автоматически.</p><input type="file" id="pick" multiple hidden></div>
<label class="f" for="nm">Название сборки</label><input id="nm" value="${esc(W.name)}">
<label class="f">Профиль</label><div class="seg" id="prof">${Object.keys(PROF).map(p=>`<button data-p="${p}" class="${p==W.prof?'on':''}">${p}</button>`).join('')}</div>
<label class="f" for="lv">Сжатие</label><select id="lv">${[[0,'Без сжатия'],[6,'Обычное'],[9,'Максимальное']].map(([v,l])=>`<option value="${v}" ${v==W.level?'selected':''}>${l}</option>`).join('')}</select>
<div class="row" style="margin-top:22px"><button class="btn" id="go">Собрать</button><button class="btn ghost" id="clr">Очистить</button></div></div>
<div class="panel"><h3>Структура сборки</h3><pre class="tree" id="tree"></pre>
<div class="stage" id="stg">${[0,1,2,3,4].map(()=>'<span></span>').join('')}</div><div class="meta" id="stl">Загрузка, анализ, сборка, проверка, готово</div><div class="log" id="log"></div><div id="ch" style="margin-top:22px"></div></div></div>`},

forum(arg){
if(arg&&arg!=='new'){const t=threads.find(x=>x.id==arg);if(t)return thread(t)}
if(arg==='new')return `<h2>Новая тема</h2><div class="panel"><label class="f" for="nc">Раздел</label><select id="nc">${CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select><label class="f" for="nt">Заголовок</label><input id="nt" maxlength="120"><label class="f" for="nb">Сообщение</label><textarea id="nb"></textarea><div class="row" style="margin-top:20px"><button class="btn" onclick="F.add()">Опубликовать</button><a class="btn ghost" href="#/forum">Отмена</a></div></div>`;
const c=F.cat;
const l=threads.filter(t=>!c||t.cat===c).sort((a,b)=>b.ts-a.ts);
return `<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:20px"><h2 style="margin:0">Форум</h2><a class="btn" href="#/forum/new">Новая тема</a></div>
<div class="chips">${['',...CATS].map(x=>`<button class="chip ${x===c?'on':''}" onclick="F.setCat('${x}')">${x||'Все'}</button>`).join('')}</div>
${l.length?l.map(th).join(''):'<p class="empty">В этом разделе пока нет тем. Создайте первую.</p>'}`},

profile(){
const posts=threads.filter(t=>t.author===me).length+threads.reduce((n,t)=>n+t.replies.filter(r=>r.a===me).length,0);
const best=threads.reduce((n,t)=>n+t.replies.filter(r=>r.a===me&&r.best).length,0);
const rep=posts*2+builds.length*5+best*10,lvl=1+Math.floor(rep/25);
const B=[['Первая сборка','Соберите один архив',builds.length>=1],['Мастер сборки','Соберите 5 архивов',builds.length>=5],['Голос сообщества','Опубликуйте 3 сообщения',posts>=3],['Помощник','Получите принятый ответ',best>=1]];
return `<h2>Профиль</h2><label class="f" for="un" style="margin-top:0">Имя пользователя</label><input id="un" value="${esc(me)}" maxlength="24" style="max-width:320px">
<div class="stats"><div><b>${builds.length}</b><span>Сборок</span></div><div><b>${posts}</b><span>Сообщений</span></div><div><b>${rep}</b><span>Репутация</span></div><div><b>${lvl}</b><span>Уровень</span></div></div>
<div class="panel" style="margin-bottom:20px"><p class="cap">Активность за 14 дней</p>${activity()}</div><div class="grid2"><div><h3 style="margin-bottom:10px">Мои сборки</h3>${builds.length?builds.slice().reverse().map(b=>`<div class="badge"><span>${esc(b.name)}<br><span class="meta mono">${b.sha.slice(0,16)}…</span></span><span class="meta">${fmt(b.size)}<br>${day(b.ts)}</span></div>`).join(''):'<p class="empty">Здесь появятся ваши сборки. Начните в мастерской.</p>'}</div>
<div><h3 style="margin-bottom:10px">Достижения</h3>${B.map(([n,d,ok])=>`<div class="badge ${ok?'':'off'}"><span>${n}<br><span class="meta">${d}</span></span><span class="meta">${ok?'получено':'закрыто'}</span></div>`).join('')}</div></div>`}
};

function th(t){return `<div class="th" tabindex="0" onclick="location.hash='#/forum/${t.id}'" onkeydown="if(event.key==='Enter')location.hash='#/forum/${t.id}'"><div><h3>${esc(t.title)}</h3><div class="meta"><span class="tag ${t.solved?'ok':''}">${t.solved?'Решено':t.cat}</span>${esc(t.author)}, ${day(t.ts)}</div></div><div class="cnt">${t.replies.length}<small>ответов</small></div></div>`}
function thread(t){
const mine=t.author===me;
return `<p style="margin-bottom:20px"><a href="#/forum" class="muted">Назад к темам</a></p><h2 style="margin-bottom:10px">${esc(t.title)}</h2><div class="meta"><span class="tag ${t.solved?'ok':''}">${t.solved?'Решено':t.cat}</span>${esc(t.author)}, ${day(t.ts)}</div><p style="margin-top:20px;max-width:70ch">${esc(t.body).replace(/\n/g,'<br>')}</p>
<section style="margin-top:40px"><h3>${x('Ответы','Replies')}: ${t.replies.length}</h3>${t.replies.map((r,i)=>`<div class="reply ${r.best?'best':''}"><div class="meta">${esc(r.a)}, ${day(r.ts)}${r.best?x(' · принятый ответ',' · accepted answer'):''}</div><p>${esc(r.t).replace(/\n/g,'<br>')}</p>${mine&&!r.best?`<button class="chip" style="margin-top:8px" onclick="F.best(${t.id},${i})">Принять ответ</button>`:''}</div>`).join('')||'<p class="empty">Ответов пока нет.</p>'}
<label class="f" for="rt">${x('Ваш ответ от имени','Your reply as')} ${esc(me)}</label><textarea id="rt"></textarea><button class="btn" style="margin-top:14px" onclick="F.reply(${t.id})">Ответить</button></section>`}

const F={cat:'',
setCat(c){F.cat=c;route()},
add(){const t=$('#nt').value.trim(),b=$('#nb').value.trim();if(!t||!b){alert(x('Заполните заголовок и сообщение.','Fill in the title and message.'));return}
const id=Math.max(0,...threads.map(x=>x.id))+1;threads.push({id,cat:$('#nc').value,title:t,body:b,author:me,ts:Date.now(),solved:false,replies:[]});save();location.hash='#/forum/'+id},
reply(id){const v=$('#rt').value.trim();if(!v){alert(x('Напишите текст ответа.','Write your reply first.'));return}threads.find(x=>x.id==id).replies.push({a:me,t:v,ts:Date.now(),best:false});save();route()},
best(id,i){const t=threads.find(x=>x.id==id);t.replies.forEach((r,j)=>r.best=j===i);t.solved=true;save();route()}};

function tree(){
const el=$('#tree');if(!el)return;
if(!W.files.length){el.innerHTML='<span class="muted">'+x('Пока пусто. Добавьте файлы, и здесь появится дерево.','Nothing here yet. Add files and the tree will appear.')+'</span>';wch();return}
const g={bin:[],assets:[],docs:[],data:[]};W.files.forEach(f=>g[grp(f.name)].push(f));
let o=`<b>${esc(slug(W.name))}/</b>\n`;const ks=Object.keys(g).filter(k=>g[k].length);
ks.forEach((k,i)=>{o+=`${i<ks.length-1?'├':'└'}─ <b>${k}/</b>\n`;g[k].forEach((f,j)=>{o+=`${i<ks.length-1?'│':' '}   ${j<g[k].length-1?'├':'└'}─ ${esc(f.name)}  ${fmt(f.size)}\n`})});
o+=`\n${x('Файлов','Files')}: ${W.files.length}, ${x('всего','total')} ${fmt(W.files.reduce((n,f)=>n+f.size,0))}`;el.innerHTML=o;wch()}

function wch(){const el=$('#ch');if(!el)return;let h='';
if(W.files.length){const z={bin:0,assets:0,docs:0,data:0};W.files.forEach(f=>z[grp(f.name)]+=f.size);h+=`<p class="cap">${x('Размер по папкам','Size by folder')}</p>`+hbar(Object.entries(z).filter(e=>e[1]),fmt)}
if(W.res)h+=`<p class="cap" style="margin-top:18px">${x('До и после сжатия','Before and after compression')}</p>`+hbar([[x('Исходно','Original'),W.res.orig],['ZIP',W.res.zip]],fmt);
el.innerHTML=h}
async function addFiles(list){
const lg=$('#log');
for(const f of list){
if(/\.zip$/i.test(f.name)&&window.JSZip){try{const z=await JSZip.loadAsync(f);for(const e of Object.values(z.files)){if(e.dir)continue;const d=await e.async('arraybuffer');W.files.push({name:e.name.split('/').pop(),size:d.byteLength,data:d})}continue}catch(e){}}
W.files.push({name:f.name,size:f.size,data:await f.arrayBuffer()})}
W.res=null;tree();if(lg)lg.textContent=''}

function stage(i,txt){W.stage=i;[...document.querySelectorAll('#stg span')].forEach((s,k)=>s.className=k<i?'done':k==i?'cur':'');const l=$('#stl');if(l)l.textContent=lang==='en'?(EN[txt]||txt):txt}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function build(){
const lg=$('#log'),btn=$('#go');
if(!W.files.length){lg.textContent=x('Сначала добавьте файлы.','Add some files first.');return}
if(!window.JSZip){lg.textContent=x('Библиотека ZIP не загрузилась. Проверьте интернет и обновите страницу.','The ZIP library failed to load. Check your connection and reload the page.');return}
btn.disabled=true;lg.innerHTML='';
try{
stage(0,'Загрузка');await wait(250);
stage(1,x('Анализ: '+W.files.length+' файлов','Analysis: '+W.files.length+' files'));await wait(350);
stage(2,'Сборка');
const root=slug(W.name),z=new JSZip(),sums=[];
for(const f of W.files){const h=await sha(f.data);const p=root+'/'+grp(f.name)+'/'+f.name;z.file(p,f.data);sums.push(h+'  '+grp(f.name)+'/'+f.name)}
z.file(root+'/CHECKSUMS.txt',sums.join('\n')+'\n');
z.file(root+'/README.txt',`${W.name}\nПрофиль: ${W.prof}\nСобрано в SINED: ${new Date().toISOString()}\nФайлов: ${W.files.length}\n`);
const blob=await z.generateAsync({type:'blob',compression:W.level?'DEFLATE':'STORE',compressionOptions:{level:W.level||1}});
stage(3,'Проверка');await wait(300);
const h=await sha(await blob.arrayBuffer());
stage(5,'Готово');
const url=URL.createObjectURL(blob);
builds.push({name:W.name,size:blob.size,sha:h,ts:Date.now()});save();
W.res={orig:W.files.reduce((n,f)=>n+f.size,0),zip:blob.size};
lg.innerHTML=`<i>${x('Сборка готова.','Build complete.')}</i> ${fmt(blob.size)}<br>SHA-256: ${h}<br><br><a class="btn" href="${url}" download="${root}.zip">${ic('dl')} ${x('Скачать ZIP','Download ZIP')}</a>`;wch();
}catch(e){stage(-1,'Ошибка сборки');lg.textContent=x('Не удалось собрать: '+e.message+'. Попробуйте меньше файлов или другое сжатие.','Build failed: '+e.message+'. Try fewer files or another compression level.')}
btn.disabled=false}

function bindWorkshop(){
const dz=$('#drop'),pk=$('#pick');if(!dz)return;
dz.onclick=()=>pk.click();dz.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pk.click()}};
pk.onchange=()=>addFiles([...pk.files]);
['dragenter','dragover'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>addFiles([...e.dataTransfer.files]));
$('#nm').oninput=e=>{W.name=e.target.value;tree()};
$('#lv').onchange=e=>W.level=+e.target.value;
$('#prof').onclick=e=>{const b=e.target.closest('button');if(!b)return;W.prof=b.dataset.p;W.level=PROF[W.prof];$('#lv').value=W.level;[...$('#prof').children].forEach(x=>x.classList.toggle('on',x===b))};
$('#go').onclick=build;$('#clr').onclick=()=>{W.files=[];W.res=null;tree();$('#log').textContent='';stage(-1,'Загрузка, анализ, сборка, проверка, готово')};
tree()}

function route(){
const [p='home',arg]=location.hash.replace(/^#\/?/,'').split('/');
const r=V[p]?p:'home';
$('#app').innerHTML=V[r](arg);tr($('#app'));
document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===r));
if(r==='workshop')bindWorkshop();
if(r==='profile')$('#un').onchange=e=>{me=e.target.value.trim()||'guest';save();route()};
window.scrollTo(0,0)}
function apply(){document.documentElement.lang=lang;document.title=x('SINED — ИИ-сборка файлов и форум сообщества','SINED — AI file assembly and community forum');tr(document.querySelector('header'));tr(document.querySelector('footer'));$('#lg').textContent=lang==='en'?'RU':'EN';route()}
$('#lg').onclick=()=>{lang=lang==='en'?'ru':'en';store.set('s_lang',lang);apply()};
addEventListener('hashchange',route);apply();
</script>
</body>
</html>
